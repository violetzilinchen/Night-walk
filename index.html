<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#161323">
<meta name="description" content="NightWalk is a critical archive of women's journeys through the city at night.">
<title>NightWalk · A critical archive after dark</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='9' fill='%23161323'/%3E%3Cpath d='M33 10a16 16 0 1 0 4 26A15 15 0 0 1 33 10Z' fill='%23e5a0cd'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --night: #151322;
  --ink: #181222;
  --panel: #272035;
  --text: #fff6fb;
  --soft: #e0cfde;
  --muted: #bdabbd;
  --pink: #e69ac8;
  --pink-bright: #f0b1d9;
  --edge: #704966;
  --line: #3d3148;
  --serif: Georgia, "Times New Roman", "Songti SC", SimSun, serif;
  --sans: system-ui, "Microsoft YaHei", sans-serif;
  --width: 1330px;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 300px;
  min-height: 100vh;
  color: var(--text);
  background: radial-gradient(ellipse at 77% 48%, #302037 0%, transparent 55%), var(--night);
  font: 15px/1.55 var(--sans);
}
body, #main { display: flex; flex-direction: column; }
#main { flex: 1; }
h1, h2, h3, p, figure, blockquote { margin: 0; }
h1, h2 { font-family: var(--serif); }
h1 { font-size: clamp(2.7rem, 5.3vw, 5.65rem); font-weight: 500; line-height: 1.01; letter-spacing: -.048em; }
h2 { font-weight: 500; line-height: 1.14; }
h3 { line-height: 1.3; }
a { color: inherit; text-underline-offset: 4px; }
button, input, textarea { font: inherit; }
button { cursor: pointer; color: inherit; }
img { display: block; width: 100%; }
svg { vertical-align: middle; }
.icon { width: 1.3em; height: 1.3em; flex: none; }
:focus-visible { outline: 2px solid #ffd1ee; outline-offset: 4px; }
[hidden] { display: none !important; }
.skip, .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip:focus { z-index: 50; width: auto; height: auto; padding: 8px 13px; clip-path: none; top: 6px; left: 8px; color: #221426; background: #ffd1ec; }
#main:focus { outline: none; }

#header { position: relative; z-index: 10; border-bottom: 1px solid #7c59762e; background: #181626; }
.header-inner, .footer-inner, .page { width: min(100%, var(--width)); margin-inline: auto; padding-inline: clamp(20px, 4.35vw, 63px); }
.header-inner { display: flex; align-items: center; gap: 24px; min-height: 70px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font: 500 1.85rem/1 var(--serif); text-decoration: none; letter-spacing: -.05em; }
.brand-mark { display: grid; place-items: center; width: 31px; height: 31px; color: var(--pink-bright); }
.brand-mark svg { width: 100%; height: 100%; }
.main-nav { display: flex; align-items: stretch; gap: clamp(15px, 2.55vw, 40px); margin-left: auto; min-height: 70px; }
.main-nav a { display: grid; position: relative; place-items: center; text-decoration: none; white-space: nowrap; font-weight: 570; }
.main-nav a[aria-current], .main-nav a:hover { color: var(--pink-bright); }
.main-nav a[aria-current]::after { content: ""; position: absolute; height: 2px; inset: auto 0 13px; background: var(--pink-bright); }
.language { min-height: 34px; border: 1px solid #674b67; border-radius: 999px; padding: 4px 10px; background: #242031; font-size: .79rem; white-space: nowrap; }
.language:hover { border-color: var(--pink); }
#footer { border-top: 1px solid #8b5e823b; background: #171424; }
.footer-inner { min-height: 63px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 24px; padding-block: 14px; font-size: .8rem; color: var(--muted); }
.footer-inner > span { display: inline-flex; align-items: center; gap: 8px; }
.footer-inner .icon { color: var(--pink); }
.footer-inner nav { display: flex; flex-wrap: wrap; gap: 16px; }
.footer-inner a:hover { color: var(--pink-bright); }

.page { padding-block: 47px 66px; }
.page-intro { display: grid; gap: 9px; max-width: 740px; margin-bottom: 26px; }
.page-intro p { max-width: 57ch; color: var(--soft); font-size: clamp(.98rem, 1.4vw, 1.19rem); }
.eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--pink-bright); font-size: .71rem; font-weight: 680; letter-spacing: .165em; text-transform: uppercase; }
.eyebrow::before { content: ""; width: 24px; height: 1px; background: currentColor; }
.glass { border: 1px solid var(--edge); border-radius: 14px; background: linear-gradient(127deg, #342740de, #241d32ed 72%); box-shadow: 0 12px 32px #08061039; }
.primary, .secondary, .small-btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border-radius: 999px; min-height: 42px; padding: 9px 18px; font-weight: 650; text-decoration: none; }
.primary { color: #231224; border: 1px solid #e6a0cc; background: linear-gradient(100deg, #e599c6, #eaa4cd 50%, #d98abc); box-shadow: 0 5px 23px #e589bd26; }
.primary:hover { background: #ffc1e5; }
.secondary, .small-btn { border: 1px solid #805b79; background: #282035; }
.secondary:hover, .small-btn:hover { border-color: var(--pink-bright); background: #423049; }
.small-btn { padding: 5px 9px; min-width: 35px; min-height: 35px; }
.back-link { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 23px; color: var(--pink-bright); font-size: .89rem; text-decoration: none; }
.back-link .icon { transform: rotate(180deg); }
.back-link:hover { text-decoration: underline; }

.landing, .reflection-hero { display: grid; flex: 1; isolation: isolate; position: relative; overflow: hidden; align-items: center; min-height: min(720px, calc(100svh - 71px)); }
.scene-image { position: absolute; inset: 0; z-index: -3; height: 100%; object-fit: cover; object-position: 66% 48%; }
.landing .scene-ambient { object-position: center 61%; opacity: .72; filter: blur(3px) brightness(.73) saturate(.82); }
.landing .landing-figure { left: auto; right: max(6vw, calc((100% - 1160px) / 2)); width: clamp(245px, 24vw, 345px); height: 100%; object-fit: cover; object-position: center 34%; mask-image: linear-gradient(90deg,transparent,black 19%,black 80%,transparent); }
.landing::before, .reflection-hero::before { content: ""; position: absolute; inset: 0; z-index: -2; background: linear-gradient(90deg, #171221 2%, #1b1224 25%, #25152bd9 39%, #2d183d50 62%, #19132112 84%), linear-gradient(0deg, #151322 1%, transparent 28%); }
.landing::after { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse at 61% 27%, #c36ed334, transparent 65%); mix-blend-mode: screen; pointer-events: none; }
.landing-inner { position: relative; display: grid; align-content: center; justify-items: start; gap: 17px; padding-top: 32px; padding-bottom: 38px; }
.landing-copy { position: relative; padding-top: 22px; }
.landing-copy::before { content: ""; width: clamp(155px, 20vw, 298px); aspect-ratio: 1; border: 1px solid transparent; border-left-color: var(--pink-bright); border-top-color: var(--pink-bright); border-radius: 50%; position: absolute; left: clamp(-38px, -2.3vw, -15px); top: clamp(-69px, -4.6vw, -26px); transform: rotate(13deg); z-index: -1; }
.landing h1 { font-size: clamp(4.6rem, 10.25vw, 9.35rem); text-shadow: 0 4px 42px #271525; }
.landing-subtitle { margin-top: 17px; max-width: 23ch; font: 500 clamp(1.4rem, 2.95vw, 2.85rem)/1.14 var(--serif); }
.landing-description { max-width: 36ch; color: #eee0ee; font-size: clamp(.96rem, 1.5vw, 1.2rem); }
.landing .primary { margin-top: 9px; min-height: 48px; padding-inline: 25px; }
.landing-index { position: absolute; right: max(22px, calc((100vw - 1200px) / 2)); bottom: 23px; color: #f7e0f2; font-size: .72rem; letter-spacing: .1em; }

.archive-home { isolation: isolate; min-height: 650px; position: relative; }
.archive-home::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg,#161324 19%, #221a30af 72%,#18142355); }
.archive-home .scene-image { object-position: center 48%; opacity: .55; }
.hub-grid { display: grid; gap: 13px; max-width: 910px; }
.hub-card { position: relative; overflow: hidden; display: grid; grid-template-columns: 51px 1fr auto; gap: 14px; align-items: center; isolation: isolate; min-height: 111px; padding: 17px 26px; text-decoration: none; }
.hub-card img { position: absolute; inset: 0 0 0 auto; z-index: -2; width: 52%; height: 100%; object-fit: cover; }
.hub-card::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg,#281f37 9%,#2e243bbf 46%,#2c203234 100%); }
.hub-card:hover { border-color: var(--pink-bright); background: #49304d; }
.hub-card > .icon:first-of-type { width: 37px; height: 37px; color: var(--pink-bright); }
.hub-card > .icon:last-child { color: var(--pink-bright); }
.hub-card h2 { font: 650 clamp(1.12rem, 2vw, 1.7rem)/1.12 var(--sans); }
.hub-card p { color: var(--soft); font-size: .89rem; margin-top: 5px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 12px 18px; justify-content: space-between; align-items: center; margin-bottom: 22px; }
.filters { display: flex; flex-wrap: wrap; gap: 7px; }
.pill { border: 1px solid #65516b; border-radius: 999px; padding: 7px 16px; background: #292339; min-height: 37px; }
.pill:hover { border-color: var(--pink-bright); }
.pill[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: #231224; font-weight: 700; }
.search-field { display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid #785873; border-radius: 999px; background: #262034; color: var(--pink-bright); width: min(100%, 286px); }
.search-field input { width: 100%; min-width: 0; border: 0; border-radius: 999px; padding: 8px 0; background: transparent; color: var(--text); }
.search-field input::placeholder { color: #c4b4c7; }
.result-count { margin: -10px 0 13px; color: var(--muted); font-size: .8rem; }
.story-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.story-card { display: grid; grid-template-rows: auto 1fr; min-width: 0; overflow: hidden; text-decoration: none; transition: transform .15s, border-color .15s; }
.story-card:hover { transform: translateY(-4px); border-color: var(--pink-bright); }
.story-card img { aspect-ratio: 1.3; object-fit: cover; background: #35283c; }
.story-card-content { padding: 15px; display: flex; flex-direction: column; gap: 5px; }
.story-card h2 { font: 680 1.04rem/1.24 var(--sans); }
.story-card p, .story-card small { color: var(--soft); font-size: .81rem; }
.story-card .icon { margin-top: auto; padding-top: 4px; color: var(--pink-bright); }
.empty { padding: 25px; }
.story-layout { display: grid; grid-template-columns: minmax(215px,.8fr) minmax(0,1.3fr); align-items: start; gap: clamp(22px, 4.7vw, 65px); }
.story-art { border-radius: 13px; aspect-ratio: 4 / 5; max-height: 580px; object-fit: cover; border: 1px solid #795675; }
.story-body { display: grid; gap: 18px; }
.story-body h1 { font-size: clamp(2.35rem,4.8vw,4.75rem); }
.story-meta { display: flex; flex-wrap: wrap; gap: 7px 20px; color: var(--soft); font-size: .89rem; }
.story-meta > span { display: inline-flex; align-items: center; gap: 6px; }
.story-meta .icon { color: var(--pink-bright); }
.story-body > p { max-width: 64ch; font-size: 1rem; color: var(--text); }
.story-body .source-link { width: fit-content; color: var(--pink-bright); font-size: .88rem; }
.insight { display: grid; gap: 4px; padding: 17px 21px; background: linear-gradient(108deg,#e9a1cb,#d883b5); color: #271527; border-radius: 12px; }
.story-controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); margin-top: 34px; padding-top: 18px; }
.story-controls a:first-child .icon { transform: rotate(180deg); }
.vigilance { position: relative; isolation: isolate; min-height: 630px; }
.vigilance .scene-image { width: 75%; left: auto; object-position: center 46%; opacity: .6; mask-image: linear-gradient(90deg,transparent,black 44%); }
.vigilance .page-intro { margin-bottom: 22px; }
.quote-box { padding: 20px 26px; width: min(100%,620px); min-height: 173px; }
.quote-box .icon { color: var(--pink-bright); width: 30px; height: 30px; }
.quote-box blockquote { margin: 4px 0 8px; font: 500 clamp(1.18rem,2vw,1.6rem)/1.35 var(--serif); }
.quote-box cite { color: var(--soft); font-size: .84rem; font-style: normal; }
.carousel { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
.carousel span { color: var(--soft); font-size: .8rem; }
.themes-list { margin-top: 21px; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 10px 17px; }
.themes-list li { display: flex; align-items: center; gap: 6px; color: var(--soft); }
.themes-list .icon { color: var(--pink-bright); }

.waiting { isolation: isolate; position: relative; min-height: 650px; }
.waiting .scene-image { left: auto; width: 72%; opacity: .69; object-position: center 47%; mask-image: linear-gradient(90deg,transparent,black 48%); }
.waiting .page-intro { margin-bottom: 35px; }
.waiting-form { max-width: 505px; display: grid; gap: 13px; }
.check-panel { padding: 10px 18px; }
.check-row { display: flex; align-items: center; gap: 10px; min-height: 52px; }
.check-row + .check-row { border-top: 1px solid #76526f60; }
.check-row > .icon { color: var(--pink-bright); }
.check-row > span { flex: 1; }
.check-row input { width: 17px; height: 17px; accent-color: var(--pink); }
.check-row .toggle { appearance: none; width: 41px; height: 23px; border: 1px solid #a67da0; border-radius: 999px; background: #42304a; position: relative; cursor: pointer; }
.check-row .toggle::before { content: ""; width: 17px; height: 17px; border-radius: 100%; background: #fceefa; position: absolute; top: 2px; left: 2px; }
.check-row .toggle:checked { background: #d885b5; }
.check-row .toggle:checked::before { transform: translateX(18px); }
.fine-print { color: var(--muted); font-size: .84rem; }
.check-preview { max-width: 505px; padding: 15px 19px; margin-top: 15px; }
.check-preview p + p { margin-top: 5px; }

.map-page { padding-top: 30px; }
.map-page .page-intro h1 { font-size: clamp(2.3rem,4.3vw,4.1rem); }
.route-layout { display: grid; grid-template-columns: minmax(230px, 285px) minmax(0, 1fr); gap: 15px; align-items: stretch; }
.route-planner { position: relative; align-self: start; padding: 19px; display: grid; gap: 12px; }
.route-planner h2 { font: 670 1.2rem/1.2 var(--sans); }
.route-field { display: grid; gap: 4px; color: var(--soft); }
.route-field > div { display: flex; gap: 6px; align-items: center; width: 100%; min-height: 38px; padding: 7px 9px; border: 1px solid #644c67; border-radius: 8px; background: #2b243b; color: var(--text); font-size: .85rem; }
.route-field .icon { color: var(--pink-bright); }
.route-swap { position: absolute; right: 16px; top: 109px; min-height: 27px; min-width: 27px; padding: 3px; }
.route-options { min-width: 0; margin: 0; padding: 0; border: 0; }
.route-options legend { font-weight: 680; margin-bottom: 5px; }
.route-option { display: flex; align-items: center; gap: 6px; min-height: 36px; color: var(--text); border-bottom: 1px solid #77557356; font-size: .86rem; cursor: pointer; }
.route-option input { margin: 0; accent-color: var(--pink); }
.route-option > :last-child { margin-left: auto; color: var(--soft); }
.route-status { font-size: .8rem; color: var(--soft); }
.route-map { position: relative; overflow: hidden; isolation: isolate; min-height: 575px; border: 1px solid #5a4566; border-radius: 14px; background: #201c33; }
.map-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-canvas > svg { width: 100%; height: 100%; display: block; }
.map-pin { cursor: pointer; background: transparent; border: 0; padding: 4px; }
.map-pin:hover, .map-pin:focus-visible { filter: drop-shadow(0 0 7px #ffd2ed); }
.map-place { color: #fff3fd; padding: 3px 5px; border-radius: 4px; background: #1b172bd9; white-space: nowrap; font: 650 clamp(.61rem,1vw,.81rem)/1.15 var(--sans); transform: translateX(-50%); }
.small-btn:disabled { opacity: .42; cursor: default; }
.map-tools { position: absolute; z-index: 2; display: flex; gap: 5px; top: 13px; right: 13px; }
.map-legend { position: absolute; z-index: 2; bottom: 12px; right: 12px; max-width: calc(100% - 24px); padding: 9px 12px; font-size: .76rem; background: #211a30f2; }
.map-legend span { display: flex; align-items: center; gap: 5px; }
.map-legend .legend-route { display: inline-block; width: 14px; height: 3px; border-radius: 999px; background: var(--pink-bright); }
.map-legend ul { margin: 5px 0 0; padding: 0; list-style: none; }
.map-legend .icon { color: var(--pink-bright); }
.map-detail { position: absolute; z-index: 4; top: 12px; right: 12px; bottom: 12px; width: min(340px, calc(100% - 24px)); overflow: auto; background: #241d31f7; }
.map-detail img { aspect-ratio: 2.28; object-fit: cover; border-radius: 13px 13px 0 0; }
.map-detail-close { position: absolute; right: 9px; top: 9px; }
.map-detail-content { display: grid; gap: 9px; padding: 14px 15px 16px; font-size: .86rem; }
.map-detail-content h2 { font: 670 1.18rem/1.18 var(--sans); }
.map-detail-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.map-detail-tags > * { border-radius: 4px; background: #5e405f; padding: 3px 6px; color: #f9e7f5; font-size: .71rem; }
.map-question { background: #49304e; border: 1px solid #85577f; padding: 10px; border-radius: 8px; }
.map-question p { margin-top: 5px; }
.map-detail-nav { display: flex; align-items: center; justify-content: space-between; gap: 5px; }

.about-grid, .source-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 13px; }
.about-card, .source-card { display: grid; align-content: start; justify-items: start; gap: 9px; padding: 22px; }
.about-card > .icon, .source-card > .icon { width: 28px; height: 28px; color: var(--pink-bright); }
.about-card h2, .source-card h2 { font-size: 1.52rem; }
.about-card p, .source-card p { color: var(--soft); font-size: .91rem; }
.about-card .secondary { margin-top: 5px; }
.context-note { padding: 18px 20px; margin-top: 18px; color: var(--soft); display: grid; gap: 6px; }
.context-note h2 { font-size: 1.33rem; color: var(--text); }
.glossary-list { display: grid; gap: 0; padding: 5px 18px; }
.glossary-list details + details { border-top: 1px solid #72546e; }
.glossary-list summary { display: grid; grid-template-columns: minmax(125px,.55fr) minmax(0,1fr) 20px; align-items: center; gap: 15px; list-style: none; cursor: pointer; min-height: 65px; padding: 11px 0; }
.glossary-list summary::-webkit-details-marker { display: none; }
.glossary-list summary span, .glossary-list details p { color: var(--soft); font-size: .91rem; }
.glossary-list details p { margin: 0 0 17px; padding: 10px 13px; background: #21192c; border-radius: 7px; }
.glossary-list details[open] summary .icon { transform: rotate(90deg); }

.reflection-hero { min-height: 575px; }
.reflection-hero::before { background: linear-gradient(90deg,#151120e8 6%,#1e152bd9 35%,#2b183747 66%,transparent), linear-gradient(0deg,#151322 0%,transparent 30%); }
.reflection-hero .scene-image { left: auto; width: 72%; object-position: 75% center; mask-image: linear-gradient(90deg,transparent,black 30%); }
.reflection-hero .page { display: grid; gap: 23px; justify-items: start; }
.reflection-hero h1 { max-width: 16ch; }
.reflection-prompts { display: grid; gap: 9px; max-width: 480px; font: italic 1.13rem/1.4 var(--serif); }
.reflection-form { display: grid; gap: 11px; max-width: 660px; margin-top: 18px; padding: 22px; }
.reflection-form label { font-weight: 650; }
.reflection-form textarea { min-height: 130px; padding: 11px; border: 1px solid #977091; border-radius: 9px; background: #1d1728; color: var(--text); resize: vertical; }
.reflection-form > div { display: flex; flex-wrap: wrap; gap: 7px; }

@media(max-width: 930px) {
  .story-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .route-layout { grid-template-columns: minmax(195px,.66fr) minmax(0,1.5fr); }
  .route-planner { padding: 13px; }
}
@media(max-width: 650px) {
  .header-inner { flex-wrap: wrap; gap: 0 13px; padding-block: 10px 0; }
  .brand { margin-right: auto; font-size: 1.65rem; }
  .main-nav { order: 3; flex: 1 0 100%; min-height: 43px; gap: 18px; margin-left: 0; overflow-x: auto; }
  .main-nav a { font-size: .9rem; }
  .main-nav a[aria-current]::after { bottom: 4px; }
  .page { padding-block: 31px 46px; }
  .landing { min-height: min(655px, calc(100svh - 96px)); }
  .landing .scene-image { object-position: 65% center; }
  .landing .landing-figure { right: 0; width: 70%; opacity: .83; }
  .landing::before { background: linear-gradient(90deg,#171221f5 0%,#21172bd4 43%,#24162e61 89%),linear-gradient(0deg,#151322 1%,transparent 22%); }
  .landing h1 { font-size: clamp(3.5rem,16vw,6rem); }
  .landing-copy { padding-top: 5px; }
  .landing-index { display: none; }
  .hub-card { min-height: 98px; grid-template-columns: 34px 1fr auto; gap: 9px; padding-inline: 14px; }
  .hub-card > .icon:first-of-type { width: 29px; height: 29px; }
  .story-grid, .about-grid, .source-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .story-card-content { padding: 10px; }
  .story-layout, .route-layout { grid-template-columns: 1fr; }
  .story-art { aspect-ratio: 1.65; max-height: 275px; }
  .route-map { min-height: 510px; }
  .map-detail { top: auto; max-height: 68%; }
  .about-card, .source-card { padding: 14px; }

function bindMap() {
  const page = document.querySelector("#map-page");
  if (!page) return;

  function refresh(selector, scroll = false) {
    page.outerHTML = renderMap();
    bindMap();
    const replacement = document.querySelector("#map-page");
    const target = replacement.querySelector(selector);
    (target?.disabled ? replacement.querySelector("#map-reset") : target)?.focus({preventScroll:!scroll});
  }

  page.addEventListener("change", (event) => {
    if (event.target.name !== "nightwalk-route") return;
    mapState.choice = Number(event.target.value);
    mapState.exploring = false;
    refresh("#" + event.target.id);
  });
  page.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    if (button.dataset.mapPin !== undefined) {
      mapState.pin = Number(button.dataset.mapPin);
      refresh("#map-detail-title");
      return;
    }
    switch (button.id) {
      case "route-swap":
        mapState.reverse = !mapState.reverse;
        refresh("#route-swap");
        break;
      case "route-start":
        mapState.exploring = true;
        mapState.pin = mapState.reverse ? 3 : 0;
        refresh("#map-detail-title", true);
        break;
      case "map-close": {
        const previous = mapState.pin;
        mapState.pin = null;
        refresh(`[data-map-pin="${previous}"]`);
        break;
      }
      case "map-prev":
      case "map-next": {
        const step = (button.id === "map-next") !== mapState.reverse ? 1 : -1;
        mapState.pin = (mapState.pin + 4 + step) % 4;
        refresh("#" + button.id);
        break;
      }
      case "map-plus":
      case "map-minus":
      case "map-reset":
        mapState.zoom = button.id === "map-reset" ? 1 : Math.min(1.75, Math.max(1, mapState.zoom + (button.id === "map-plus" ? .25 : -.25)));
        refresh("#" + button.id);
        break;
    }
  });
}

    <nav class="main-nav" aria-label="${L("Main navigation","主导航")}">${["home","stories","map","about"].map((name) =>
      `<a href="#${name}" ${name === active ? 'aria-current="page"' : ""}>${pick(pages[name])}</a>`).join("")}</nav>
    <button id="language" class="language" type="button" aria-label="${L("Switch to Chinese","Switch to English")}">${L("中文","EN")}</button>
  </div>`;
  document.querySelector("#footer").innerHTML = `<div class="footer-inner">
    <span>${ico("moon")} NightWalk · ${L("A critical archive of journeys after dark","夜行城市 · 女性安全档案")}</span>
    <nav aria-label="${L("Archive information","档案信息")}">${["sources","glossary","reflection"].map((name) => `<a href="#${name}">${pick(pages[name])}</a>`).join("")}</nav>
  </div>`;
}

const heading = (tag, title, description) => `<div class="page-intro"><span class="eyebrow">${tag}</span><h1>${title}</h1><p>${description}</p></div>`;
const back = (href, label) => `<a class="back-link" href="${href}">${ico("arrow")}${label}</a>`;
const cta = (href, label, style = "primary") => `<a class="${style}" href="${href}">${label} ${ico("arrow")}</a>`;

function renderHome() {
  return `<section class="landing" aria-labelledby="landing-title">
    ${image("city-wide","scene-image scene-ambient")}${image("hero","scene-image landing-figure")}
    <div class="page landing-inner">
      <span class="eyebrow">${L("A city after dark","入夜之后")}</span>
      <div class="landing-copy"><h1 id="landing-title">NightWalk</h1><p class="landing-subtitle">${L("A Critical Archive of Women’s Night-Time Journeys","女性城市夜行档案")}</p></div>
      <p class="landing-description">${L("Exploring how cities, data and everyday systems shape women’s safety after dark.","探索城市空间、数据与日常系统如何影响女性的夜间出行。")}</p>
      ${cta("#archive",L("Enter Archive","进入档案"))}
    </div>
    <span class="landing-index">${L("01 / NIGHT-TIME JOURNEYS","01 / 城市夜行")}</span>
  </section>`;
}

function renderArchive() {
  const cards = [
    ["map","pin","map-preview",L("Navigate the City","走进夜间城市"),L("Explore routes with context along the way.","探索示意路线与沿途的故事笔记。")],
    ["stories","layers","flowers",L("City Stories","城市故事"),L("Public cases, fictional voices and field notes.","公开案件、虚构体验和观察笔记。")],
    ["waiting","people","window-scene",L("Someone Is Waiting","有人在等"),L("Care, connection and the journey home.","回家路上的关心与联系。")],
  ];
  return `<section class="page archive-home">${image("hero-wide","scene-image")}
    ${heading(L("The archive","夜行档案"),L("Rethinking the Night-Time City","重新思考夜间城市"),L("Stories, everyday decisions and questions about women’s freedom to move through public space.","读故事、看见日常选择，思考女性在公共空间的出行自由。"))}
    <div class="hub-grid">${cards.map(([href,icon,art,title,summary]) => `<a class="hub-card glass" href="#${href}">${image(art)}${ico(icon)}<div><h2>${title}</h2><p>${summary}</p></div>${ico("arrow")}</a>`).join("")}</div>
  </section>`;
}

function storyResults() {
  const tokens = state.search.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
  const stories = content.stories.filter((story) => {
    if (state.category !== "all" && state.category !== story.category) return false;
    const text = [story.title,story.subtitle,story.location,story.date,...story.paragraphs,categories[story.category]].flat().join(" ").toLocaleLowerCase();
    return tokens.every((term) => text.includes(term));
  });
  return `<p class="result-count" role="status">${L(`${stories.length} ${stories.length === 1 ? "story" : "stories"}`,`${stories.length} 篇故事`)}</p>
    ${stories.length ? `<div class="story-grid">${stories.map((story) => `<a class="story-card glass" href="${storyURL(story)}">${image(story.id === "sabina" ? "flowers" : story.image)}
      <div class="story-card-content"><h2>${pick(story.title)}</h2><p>${pick(story.subtitle)}</p><small>${pick(story.location)} · ${pick(story.date)}</small>${ico("arrow")}</div></a>`).join("")}</div>` :
    `<div class="glass empty"><p>${L("No stories match these filters.","没有符合条件的故事。")}</p><button class="secondary" id="clear-search" type="button">${L("Clear filters","清除筛选")}</button></div>`}`;
}

function renderStories() {
  return `<section class="page stories-page">
    ${heading(L("From the archive","夜行档案"),L("City Stories","城市故事"),L("Public cases, fictional experiences and sample observations about women’s night journeys.","从公开案件、虚构体验和观察示例中，了解女性的城市夜行。"))}
    <div class="toolbar"><div class="filters" role="group" aria-label="${L("Story categories","故事分类")}">${Object.entries(categories).map(([id,label]) => `<button type="button" class="pill" data-category="${id}" aria-pressed="${state.category === id}">${pick(label)}</button>`).join("")}</div>
      <label class="search-field">${ico("search")}<span class="visually-hidden">${L("Search stories","搜索故事")}</span><input id="story-search" type="search" placeholder="${L("Search stories…","搜索故事…")}" value="${safe(state.search)}"></label></div>
    <div id="story-results">${storyResults()}</div>
  </section>`;
}

function storyControls(story) {
  const index = content.stories.indexOf(story);
  const previous = content.stories[(index + content.stories.length - 1) % content.stories.length];
  const next = content.stories[(index + 1) % content.stories.length];
  return `<nav class="story-controls" aria-label="${L("More stories","更多故事")}">
    <a class="secondary" href="${storyURL(previous)}">${ico("arrow")} ${L("Previous story","上一篇")}</a>
    ${cta(storyURL(next), L("Next story","下一篇"), "secondary")}
  </nav>`;
}

function quoteSlide() {
  const {quote,note} = content.voices[state.voice];
  return `<div class="glass quote-box">${ico("quote")}<blockquote>“${pick(quote)}”</blockquote><cite>${pick(note)}</cite></div>`;
}

function renderStory(id) {
  const story = content.stories.find((entry) => entry.id === id);
  const backLink = back("#stories",L("Back to Stories","返回故事"));
  if (id === "vigilance") return `<section class="page vigilance">${image("vigilance","scene-image")}${backLink}
    ${heading(L("Fictional vignettes","虚构片段"),pick(story.title),pick(story.subtitle))}
    <div id="quote-slide" aria-live="polite">${quoteSlide()}</div>
    <div class="carousel" aria-label="${L("Testimony carousel","体验叙事轮播")}">
      <button class="small-btn" type="button" data-slide="-1" aria-label="${L("Previous vignette","上一段")}">‹</button>
      <span id="slide-count">${state.voice + 1} / ${content.voices.length}</span>
      <button class="small-btn" type="button" data-slide="1" aria-label="${L("Next vignette","下一段")}">›</button>
    </div>
    <ul class="themes-list"><li>${ico("route")} ${L("Detours","绕行")}</li><li>${ico("sun")} ${L("Lighting","照明")}</li><li>${ico("phone")} ${L("Check-ins","报平安")}</li></ul>
    ${storyControls(story)}
  </section>`;
  return `<section class="page">${backLink}<div class="story-layout">
    ${image(id === "sabina" ? "flowers" : story.image,"story-art")}
    <article class="story-body"><span class="eyebrow">${pick(categories[story.category])}</span><h1>${pick(story.title)}</h1>
      <div class="story-meta"><span>${ico("clock")}${pick(story.date)}</span><span>${ico("pin")}${pick(story.location)}</span></div>
      ${story.paragraphs.map((line) => `<p>${pick(line)}</p>`).join("")}
      ${story.source ? `<a class="source-link" href="${story.source.url}" target="_blank" rel="noopener noreferrer">${ico("file")} ${pick(story.source.label)} ↗</a>` : ""}
      <div class="insight"><strong>${L("What does this reveal?","这让我们看见什么？")}</strong><p>${pick(story.insight)}</p></div>
      ${id === "waiting" ? cta("#waiting",L("Try the check-in demo","体验报平安设置"),"secondary") : ""}
    </article></div>${storyControls(story)}</section>`;
}

function checkPreview() {
  const choices = state.check;
  if (!choices.preview) return "";
  if (!choices.share) return `<strong>${L("Check-in is off","报平安已关闭")}</strong><p>${L("Turn on the optional check-in to preview the messages.","开启可选报平安后，即可预览消息。")}</p>`;
  const messages = [choices.depart && L("“I’ve set off.”","「我出发了。」"), choices.arrive && L("“I’m home.”","「我到家了。」")].filter(Boolean);
  return `<strong>${L("Message preview","消息预览")}</strong>${messages.length ? messages.map((message) => `<p>${message}</p>`).join("") : `<p>${L("Choose at least one time to check in.","请选择至少一个报平安时机。")}</p>`}`;
}

function renderWaiting() {
  const choices = state.check;
  return `<section class="page waiting">${image("waiting","scene-image")}
    ${heading(L("Care & Connection","关心与联系"),L("Someone Is Waiting","有人在等"),L("The journey home connects the person walking and the person waiting.","回家的路连接着行走的人，也连接着在等待的人。"))}
    <form class="waiting-form" id="waiting-form">
      <div class="glass check-panel">
        <label class="check-row">${ico("plus")}<span>${L("Share a check-in (optional)","分享报平安消息（可选）")}</span><input class="toggle" name="share" type="checkbox" role="switch" ${choices.share ? "checked" : ""}></label>
        <label class="check-row">${ico("route")}<span>${L("Notify a contact when I set off","出发时通知联系人")}</span><input name="depart" type="checkbox" ${choices.depart ? "checked" : ""} ${choices.share ? "" : "disabled"}></label>
        <label class="check-row">${ico("check")}<span>${L("Confirm when I arrive","到达后报平安")}</span><input name="arrive" type="checkbox" ${choices.arrive ? "checked" : ""} ${choices.share ? "" : "disabled"}></label>
      </div>
      <button type="submit" class="primary">${L("Preview Setup","预览设置")} ${ico("arrow")}</button>
      <p class="fine-print">${L("Prototype · messages stay on this page.","交互原型 · 消息仅在本页预览。")}</p>
    </form>
    <div id="check-preview" class="glass check-preview" aria-live="polite" ${choices.preview ? "" : "hidden"}>${checkPreview()}</div>
  </section>`;
}

function renderAbout() {
  const cards = [
    ["sources","file",L("Where the archive’s material comes from, and what it can tell us.","档案资料从哪里来？它们能说明什么？")],
    ["glossary","book",L("Four ideas behind the design of NightWalk.","理解 NightWalk 设计的四个概念。")],
    ["reflection","quote",L("Consider whose experiences are visible in the everyday map.","思考谁的出行体验被日常地图看见。")],
  ];
  return `<section class="page">${heading(L("Behind the archive","档案背后"),L("About NightWalk","关于 NightWalk"),L("A critical design prototype on women’s night-time mobility, public space and the people who care for one another.","一个关注女性夜间出行、公共空间与相互关怀的批判性设计原型。"))}
    <div class="about-grid">${cards.map(([href,icon,summary]) => `<article class="glass about-card">${ico(icon)}<h2>${pick(pages[href])}</h2><p>${summary}</p>${cta("#"+href,L("Explore","打开"),"secondary")}</article>`).join("")}</div></section>`;
}

function renderSources() {
  const cards = [
    ["file",L("Official Records","官方记录"),L("The two named cases are summarized from published court sentencing remarks. Open either story for its source.","两则实名案件依据公开的法院量刑陈词整理，来源链接见故事详情。")],
    ["book",L("Media Reports","媒体报道"),L("Verified reporting can add context to an archive. The two cases in this edition link directly to court records.","经核实的报道可以补充档案背景。本版本的两则案件直接链接法院记录。")],
    ["people",L("Field Research","实地研究"),L("The map notes and everyday stories illustrate observation and design fiction. They are marked as examples.","地图笔记与日常故事展示观察和设计虚构，页面均标注了示例性质。")],
  ];
  return `<section class="page">${back("#about",L("Back to About","返回关于"))}
    ${heading(L("Reading the archive","阅读档案"),L("Data & Context","资料与背景"),L("Understand the sources, scope and limitations behind the stories and map.","了解故事和地图的资料来源、范围与局限。"))}
    <div class="source-grid">${cards.map(([icon,title,description]) => `<article class="glass source-card">${ico(icon)}<h2>${title}</h2><p>${description}</p></article>`).join("")}</div>
    <section class="glass context-note"><h2>${ico("info")} ${L("Limitations","使用局限")}</h2><p>${L("Historical records describe their own time and place. Routes, walking times and map notes in this prototype are illustrations for discussion. Photographs are illustrative crops from the supplied design references.","历史记录反映当时的时间与地点。本原型的路线、用时和地图笔记用于讨论，配图来自所提供的设计参考。")}</p></section>
  </section>`;
}

function renderGlossary() {
  return `<section class="page">${back("#about",L("Back to About","返回关于"))}
    ${heading(L("Ideas behind NightWalk","NightWalk 的设计概念"),L("Glossary","术语表"),L("Key terms for understanding women’s night-time safety and critical design.","理解女性夜间安全与批判性设计的关键术语。"))}
    <div class="glass glossary-list">${content.glossary.map(({term,summary,detail}) => `<details><summary><strong>${pick(term)}</strong><span>${pick(summary)}</span>${ico("chevron")}</summary><p>${pick(detail)}</p></details>`).join("")}</div>
  </section>`;
}

function renderReflection() {
  return `<section class="reflection-hero">${image("reflection","scene-image")}
    <div class="page"><span class="eyebrow">${L("A closing reflection","留给读者的反思")}</span>
    <h1>${L("A Map for Reflection, Not Just a Route.","一张让人停下来思考的地图。")}</h1>
    <div class="reflection-prompts"><p>${L("Why do we still have to plan, adjust and protect ourselves just to move freely at night?","为什么只是在夜间自由出行，就需要反复计划和调整？")}</p>
    <p>${L("Whose experiences are missing from everyday navigation?","日常导航遗漏了谁的体验？")}</p></div>
    <button class="primary" id="open-reflection" aria-controls="reflection-form" aria-expanded="false" type="button">${L("Write Your Thoughts","写下你的想法")} ${ico("arrow")}</button>
    <form class="reflection-form glass" id="reflection-form" hidden>
      <label for="reflection-text">${L("Your reflection","你的反思")}</label>
      <textarea id="reflection-text" name="reflection" maxlength="2400" rows="4">${safe(state.note)}</textarea>
      <p class="fine-print">${L("Your note stays on this device.","笔记保存在当前设备。")}</p>
      <div><button class="primary" type="submit">${L("Save locally","保存在本机")}</button></div>
      <p id="reflection-status" role="status"></p>
    </form></div></section>`;
}

const views = {home:renderHome,archive:renderArchive,stories:renderStories,map:renderMap,story:renderStory,
  waiting:renderWaiting,about:renderAbout,sources:renderSources,glossary:renderGlossary,reflection:renderReflection};

function render(focus = false) {
  const [page,id] = locationPage();
  shell(page);
  main.innerHTML = views[page](id);
  document.title = `NightWalk · ${page === "story" ? pick(content.stories.find((story) => story.id === id).title) : pick(pages[page])}`;
  if (page === "map") bindMap();
  if (focus) {
    window.scrollTo(0,0);
    main.focus({preventScroll:true});
  }
}

function refreshStories() {
  const results = document.querySelector("#story-results");
  if (results) results.innerHTML = storyResults();
  document.querySelectorAll("[data-category]").forEach((button) => button.setAttribute("aria-pressed", button.dataset.category === state.category));
}

document.addEventListener("click", (event) => {
  const target = event.target.closest("button, a.skip");
  if (!target) return;
  if (target.classList.contains("skip")) {
    event.preventDefault();
    main.focus();
  } else if (target.id === "language") {
    state.lang = L("zh","en");
    storage.write("lang",state.lang);
    render();
    document.querySelector("#language").focus({preventScroll:true});
  } else if (target.dataset.category) {
    state.category = target.dataset.category;
    refreshStories();
  } else if (target.id === "clear-search") {
    state.category = "all";
    state.search = "";
    const input = document.querySelector("#story-search");
    input.value = "";
    refreshStories();
    input.focus();
  } else if (target.dataset.slide) {
    state.voice = (state.voice + Number(target.dataset.slide) + content.voices.length) % content.voices.length;
    document.querySelector("#quote-slide").innerHTML = quoteSlide();
    document.querySelector("#slide-count").textContent = `${state.voice + 1} / ${content.voices.length}`;
  } else if (target.id === "open-reflection") {
    const form = document.querySelector("#reflection-form");
    form.hidden = !form.hidden;
    target.setAttribute("aria-expanded",!form.hidden);
    if (!form.hidden) document.querySelector("#reflection-text").focus();
  }
});

document.addEventListener("input",(event) => {
  if (event.target.id === "story-search") {
    state.search = event.target.value;
    refreshStories();
  }
  if (event.target.id === "reflection-text") state.note = event.target.value;
});

document.addEventListener("change",(event) => {
  if (event.target.form?.id !== "waiting-form") return;
  state.check[event.target.name] = event.target.checked;
  event.target.form.elements.depart.disabled = !state.check.share;
  event.target.form.elements.arrive.disabled = !state.check.share;
  document.querySelector("#check-preview").innerHTML = checkPreview();
});

document.addEventListener("submit",(event) => {
  if (event.target.id === "waiting-form") {
    event.preventDefault();
    state.check.preview = true;
    const preview = document.querySelector("#check-preview");
    preview.innerHTML = checkPreview();
    preview.hidden = false;
  }
  if (event.target.id === "reflection-form") {
    event.preventDefault();
    state.note = event.target.elements.reflection.value;
    document.querySelector("#reflection-status").textContent = storage.write("reflection",state.note) ?
      L("Saved on this device.","已保存在当前设备。") :
      L("Saved for this session. The browser blocked local storage.","本次浏览期间可保留，浏览器限制了本地存储。");
  }
});

window.addEventListener("hashchange", () => render(true));
render();
</script>
</body>
</html>
